; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ESP32-C3, ESP32-S3, ESP32-C3-DBG, ESP32-S3-DBG


[env]
monitor_speed = 115200
monitor_filters = time
board_build.partitions = partitions.csv
; Fix to the specific platform revision due to binary output size.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=2
    -D SUPLA_LOG_VERBOSE={}
    -D APP_VERSION="1.0.1"

lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    theengs/TheengsDecoder@^2.5.0
    h2zero/NimBLE-Arduino@^2.5.2
    https://github.com/SUPLA/supla-device.git#v26.8

extra_scripts = post:merge-bin.py



[env:ESP32-C3]
board = lolin_c3_mini
framework = arduino
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DPLATFORM_NAME=\"C3\"


[env:ESP32-S3]
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    ${env.build_flags}
    -DPLATFORM_NAME=\"S3\"
    -DGPIO_LED_NUM=48
    -DGPIO_LED_MODE=2


[env:ESP32-C3-DBG]
board = lolin_c3_mini
framework = arduino
build_flags =
    ${env.build_flags}
    -DAPP_DEBUG=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DPLATFORM_NAME=\"C3\"


[env:ESP32-S3-DBG]
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    ${env.build_flags}
    -DAPP_DEBUG=1
    -DPLATFORM_NAME=\"S3\"
    -DGPIO_LED_NUM=48
    -DGPIO_LED_MODE=2
